# Methods for knowledge-graph completion. Method identity is decided here,
# by code, never by the model: a label is cleaned (citation brackets such as
# [6] or a LaTeX symbol in brackets and the suffix markers below are removed), then matched
# exactly after the shared normalization (case, whitespace, dashes). So
# "R-GCN" and "RGCN" meet without an alias; real alternative names need one.
# A label matching nothing becomes a new, unconfirmed method.

topic = "kg-completion"

# Removed from the end of a label (repeatedly), never from inside a name ("A*Net").
suffix_markers = ["*", "†", "‡", "(ours)", "(Ours)", "(Proposed Method)", "(proposed)"]

