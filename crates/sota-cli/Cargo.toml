[package]
name = "sota-cli"
description = "The `sota` command-line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "sota"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
sota-core = { path = "../sota-core" }
sota-extract = { version = "0.1.0", path = "../sota-extract" }
sota-ingest = { version = "0.1.0", path = "../sota-ingest" }
sota-store = { version = "0.1.0", path = "../sota-store" }

[dev-dependencies]
sota-core = { path = "../sota-core" }
tempfile = "3.27.0"
