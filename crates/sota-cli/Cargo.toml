[package]
name = "sota-cli"
description = "The `sota` command-line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "sota"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
sota-core = { path = "../sota-core" }

[dev-dependencies]
tempfile = "3.27.0"
