[[table]]
id = "S5.T8"
header_rows = 2
settings = { protocol = "filtered" }
evidence = "Caption: FB15k results are taken from RotatE (Sun et al., 2019), filtered; S5.SS1.p3 for PairRE."
notes = """FB15k Hits@10 by relation category, over head and tail queries: the baselines are \
the means of RotatE's head and tail numbers (ComplEx 1-to-N: (.969 + .823) / 2 = .896). \
