# A Re-evaluation of Knowledge Graph Completion Methods (Sun et al., 2020)
# Held-out: drafted before any extraction of this paper was run. Check it
# against the linked tables, then tick it in gold/kgc-heldout/REVIEW.md.
#
# The paper is about evaluation itself: when several candidates tie, "Top"
# puts the correct entity first, "Bottom" last, "Random" anywhere. ConvE,
# RotatE and TuckER use a Random-like strategy; ConvKB, CapsE and KBAT use
# Top, and KBAT also leaked test triples (S5.SS4.p1, S5.SS4.p2). The registry
# has no tie-breaking setting, so only numbers obtained the standard way are
# results: the Random columns, and the reported numbers of ConvE, RotatE and
# TuckER. Everything else must go to review.

