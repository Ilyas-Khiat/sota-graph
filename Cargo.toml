[workspace]
resolver = "3"
members = ["crates/sota-core", "crates/sota-cli", "crates/sota-ingest", "crates/sota-extract"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ilyas-Khiat/sota-graph"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
